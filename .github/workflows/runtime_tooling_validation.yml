name: Runtime Tooling Validation

# Validates the portable runtime tooling layer:
# - runtime profile loading
# - sidecar client import and protocol constants
# - local runtime validator (platform detection, backend check)
# - shell script syntax checking
# - backward compatibility verification

on:
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'app/**'
      - 'tests/test_runtime_tooling_layer.py'
  pull_request:
    branches:
      - main

concurrency:
  group: tooling-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling-validation:
    name: Runtime tooling layer validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate shell script syntax
        run: |
          echo "Checking shell scripts..."
          for f in tools/*.sh tools/runtime_profiles/*.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" && echo "  OK: $f" || { echo "  FAIL: $f"; exit 1; }
            fi
          done
          echo "All shell scripts pass syntax check"

      - name: Validate profile files exist
        run: |
          python - <<'EOF'
          from tools.lib.runtime_profiles import list_profiles, KNOWN_PROFILES
          profiles = list_profiles()
          print(f"Found profiles: {profiles}")
          for p in KNOWN_PROFILES:
              assert p in profiles, f"Expected profile '{p}' not found"
          print("All known profiles present")
          EOF

      - name: Validate profile loading
        run: python -m pytest tests/test_runtime_tooling_layer.py -q --tb=short -k "profile"

      - name: Validate sidecar client
        run: python -m pytest tests/test_runtime_tooling_layer.py -q --tb=short -k "sidecar"

      - name: Validate niblit_ctl CLI wrapper
        run: |
          python tools/niblit_ctl.py --help >/dev/null
          python tools/cloud_runtime_ctl.py --help >/dev/null

      - name: Validate local runtime validator
        run: python -m pytest tests/test_runtime_tooling_layer.py -q --tb=short -k "runtime_validator"

      - name: Validate backward compatibility
        run: python -m pytest tests/test_api.py -q --tb=short

      - name: Run full tooling test suite
        run: python -m pytest tests/test_runtime_tooling_layer.py -q --tb=short

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tooling-results-py${{ matrix.python-version }}
          path: .coverage
          retention-days: 14
          if-no-files-found: ignore
